[package]
name = "sadhbh-c0d3/private-poker-nextjs"
version = "0.1.1"
description = "Private Poker (Next)"

[dependencies]
"sadhbh-c0d3/edgejs-quickjs" = "^0.0.4"

[fs]
"/app" = ".next/standalone"

[[command]]
name = "run"
module = "sadhbh-c0d3/edgejs-quickjs:edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/app/server.js"]
