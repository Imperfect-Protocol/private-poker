[package]
name = "sadhbh-c0d3/private-poker-nextjs"
version = "0.1.1"
description = "Private Poker (Next)"

[fs]
"/.next" = ".dist/.next"
"/node_modules" = ".dist/node_modules"
"/public" = ".dist/public"
"/server" = ".dist/server"

[[module]]
name = "edge"
source = "/Users/sadhbh/src/dev/edgejs/build-quickjs-wasix/edge.wasm"

[[command]]
name = "run"
module = "edge"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/server/router.cjs"]
